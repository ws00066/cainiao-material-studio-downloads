<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>菜鸟素材工坊</title>
<style>body{font:16px/1.8 system-ui;background:#f7f8f3;color:#263b30;margin:0;padding:12vh 20px}main{max-width:580px;margin:auto;padding:32px;background:white;border-radius:20px}h1{font-size:28px}button,a{background:#ed682d;color:white;border:0;padding:12px 22px;border-radius:9px;font:inherit;cursor:pointer;text-decoration:none}small{display:block;color:#758174;margin-top:24px}</style>
<main data-endpoint="https://manufacturer-assume-distributed-plymouth.trycloudflare.com"><h1>菜鸟素材工坊</h1><p id="status" role="status">正在查找可用工作台…</p><a id="open" hidden>进入素材工坊</a><button id="retry" hidden>重新连接</button><small>无需安装软件。请保留同事发来的完整分享链接。维护者电脑与采集服务需要保持运行。</small></main>
<script>
const params=new URLSearchParams(location.hash.slice(1)),access=params.get('access');
const status=document.getElementById('status'),open=document.getElementById('open'),retry=document.getElementById('retry');
function validTarget(base){const target=new URL(base);if(target.protocol!=='https:'||! /^[a-z0-9-]+\.trycloudflare\.com$/.test(target.hostname)||target.username||target.password)throw Error('address');return target;}
async function connect(){
 retry.hidden=true;open.hidden=true;
 if(!access){status.textContent='分享链接缺少访问码，请使用同事发来的完整链接打开。';return;}
 status.textContent='正在连接最新工作台…';
 let target,usedFallback=false;
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);
 try{
  const config=new URL('endpoint.json',location.href);config.hash='';config.search='t='+Date.now();
  const response=await fetch(config,{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw Error('entry');const info=await response.json();target=validTarget(info.base);
 }catch{
  try{target=validTarget(document.querySelector('main').dataset.endpoint);usedFallback=true;}
  catch{status.textContent='分享入口配置暂时不可用，请点击重新连接；若仍失败，请联系维护者更新入口。';retry.hidden=false;return;}
 }finally{clearTimeout(timeout);}
 try{
  target.pathname='/';target.searchParams.set('access',access);
  open.href=target.href;open.hidden=false;retry.hidden=false;status.textContent=usedFallback?'正在使用最近发布的工作台入口；未自动跳转时请点击进入。':'正在打开工作台；未自动跳转时请点击进入。';
  location.replace(target.href);
 }catch{status.textContent='请点击“进入素材工坊”打开工作台。';retry.hidden=false;}
}
retry.onclick=connect;connect();
</script></html>
